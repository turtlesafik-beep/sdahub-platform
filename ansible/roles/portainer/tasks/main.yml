---
- name: Prepare Portainer data directory permissions
  ansible.builtin.file:
    path: "{{ data_dir }}/portainer"
    state: directory
    owner: "{{ portainer_uid }}"
    group: "{{ portainer_gid }}"
    mode: "0755"
    recurse: true

- name: Verify docker installation
  ansible.builtin.command:
    cmd: docker --version
  changed_when: false

- name: Copy Portainer compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ compose_dir }}/portainer/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"

- name: Start Portainer
  community.docker.docker_compose_v2:
    project_src: "{{ compose_dir }}/portainer"
    state: present