---
- name: Prepare Prometheus data directory permissions
  ansible.builtin.file:
    path: "{{ data_dir }}/prometheus"
    state: directory
    owner: "{{ prometheus_uid }}"
    group: "{{ prometheus_gid }}"
    mode: "0755"
    recurse: true

- name: Deploy Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ config_dir }}/prometheus/prometheus.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"

- name: Deploy docker-compose for Prometheus
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ compose_dir }}/prometheus/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Start Prometheus
  community.docker.docker_compose_v2:
    project_src: "{{ compose_dir }}/prometheus"
    state: present