---
- name: Create directory for Grafana config
  ansible.builtin.file:
    path: "{{ config_dir }}/grafana"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Create directory for Grafana data
  ansible.builtin.file:
    path: "{{ data_dir }}/grafana"
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"

- name: Create monitoring network (if not exists)
  community.docker.docker_network:
    name: monitoring
    driver: bridge
    state: present
  become: yes

- name: Deploy Grafana datasources config
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ config_dir }}/grafana/datasources.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Deploy docker-compose for Grafana
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ compose_dir }}/grafana/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Reset ssh connection
  ansible.builtin.meta:
    reset_connection

- name: Start Grafana
  community.docker.docker_compose_v2:
    project_src: "{{ compose_dir }}/grafana"
    state: present