---
- name: Create SDAHub directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
  loop:
    # Root
    - "{{ sdahub_root }}"

    # Infrastructure
    - "{{ compose_dir }}"
    - "{{ config_dir }}"
    - "{{ data_dir }}"
    - "{{ backup_dir }}"
    - "{{ scripts_dir }}"

    # Compose projects
    - "{{ compose_dir }}/grafana"
    - "{{ compose_dir }}/prometheus"
    - "{{ compose_dir }}/loki"
    - "{{ compose_dir }}/promtail"
    - "{{ compose_dir }}/node_exporter"
    - "{{ compose_dir }}/portainer"

    # Configs
    - "{{ config_dir }}/grafana"
    - "{{ config_dir }}/prometheus"
    - "{{ config_dir }}/loki"
    - "{{ config_dir }}/promtail"
    - "{{ config_dir }}/nginx"

    # Persistent data
    - "{{ data_dir }}/grafana"
    - "{{ data_dir }}/prometheus"
    - "{{ data_dir }}/loki"
    - "{{ data_dir }}/portainer"

    # Certbot
    - "{{ sdahub_root }}/certbot"
    - "{{ sdahub_root }}/certbot/www"
    - "{{ sdahub_root }}/certbot/conf"

    - name: Fix Grafana data permissions
  ansible.builtin.file:
    path: "{{ data_dir }}/grafana"
    owner: "472"
    group: "472"
    mode: "0750"
    recurse: true


- name: Fix Loki data permissions
  ansible.builtin.file:
    path: "{{ data_dir }}/loki"
    owner: "10001"
    group: "10001"
    mode: "0750"
    recurse: true


- name: Fix Prometheus data permissions
  ansible.builtin.file:
    path: "{{ data_dir }}/prometheus"
    owner: "65534"
    group: "65534"
    mode: "0750"
    recurse: true


- name: Fix Portainer data permissions
  ansible.builtin.file:
    path: "{{ data_dir }}/portainer"
    owner: "0"
    group: "0"
    mode: "0750"
    recurse: true